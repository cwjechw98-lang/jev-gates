name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline:
    name: Offline suite (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Full suite (no API key, no network)
        # Bare `node --test` discovers every file under test/. Naming a single
        # file here is how a suite silently stops covering the new cases.
        run: node --test
      - name: The DSH adapter must not require the harness to be installed
        run: |
          node adapters/dsh/doctor.mjs || test $? -eq 1 || test $? -eq 2
          node adapters/dsh/install.mjs plan

  rubric:
    name: Rubric stand (needs a key)
    runs-on: ubuntu-latest
    env:
      # The secrets context is not available in a step-level `if`; carry it into
      # env at job level and test env instead.
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Run the fixture
        if: ${{ env.TYPESAFE_API_KEY != '' }}
        run: node scripts/jev-evals.mjs run fixtures/claim-support.json
      - name: No key
        if: ${{ env.TYPESAFE_API_KEY == '' }}
        run: |
          echo "TYPESAFE_API_KEY is not set, so the model-backed stand is skipped."
          echo "Skipped is not failed: without a key the judge is unreachable, and"
          echo "an unreachable judge means UNVERIFIED, never a blocked pipeline."
